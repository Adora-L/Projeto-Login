<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Estilos/styles.css">
    <link rel="stylesheet" href="Estilos/medea-query.css">
    <link rel="shortcut icon" href="Imagens/Icone Akatsuki.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login">
            <div id="image">

            </div>
            <div id="formulary">
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta.</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <span class="material-symbols-outlined">
                            alternate_email</span>
                        <input type="email" name="E-mail" id="E-mail" placeholder="Seu E-mail" autocomplete="email" required minlength="30">
                        <label for="Email">Login</label>
                    </div>

                    <div class="campo">
                        <span class="material-symbols-outlined">
                            lock</span>
                        <input type="password" name="Senha" id="Password" placeholder="Sua senha" autocomplete="current-password" required minlength="8" maxlength="20">
                        <label for="Password">Senha</label>
                    </div>
                        <input type="submit" value="Entrar">
                        <a href="esqueci.html" class="button">Esqueci a senha <span class="material-symbols-outlined">
                        mail
                        </span></a>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
